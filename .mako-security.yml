# Mako Security CLI Configuration
# Place this file at .mako-security.yml in your project root

version: 1

# API configuration (configured by mako init)
api:
  endpoint: https://mako-api.ruizrica2.workers.dev
  dsn: https://mk_005019a4ab217ae7a73881bf1d83cd7d171a64ee30df3071d1b1d917997dc965@mako-api.ruizrica2.workers.dev/api/v1/proj_6f7023e1278a
  auto_upload: true

# Scanner configurations
scanners:
  # Software Composition Analysis (SCA)
  sca:
    enabled: true
    fail_on: high

  # Static Application Security Testing (SAST)
  sast:
    enabled: true
    fail_on: medium

  # Infrastructure as Code (IaC)
  iac:
    enabled: true
    fail_on: high

  # Dynamic Application Security Testing (DAST)
  dast:
    enabled: false
    fail_on: medium
    # target_url: https://your-app.local

# Ignore rules for suppressing findings
ignore:
  cves: []        # CVE IDs to ignore (e.g., [CVE-2021-1234])
  rules: []       # SAST rule IDs to ignore (e.g., [ENTROPY-DETECT])
  paths: []       # File paths to ignore (glob patterns)

# Compliance frameworks
compliance:
  frameworks: []  # e.g., [OWASP-Top10, PCI-DSS]
